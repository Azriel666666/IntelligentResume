server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intelligent_resume?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MinIO配置
minio:
  endpoint: http://localhost:9005
  access-key: root
  secret-key: 12345678
  # 头像存储桶
  avatar-bucket: avatar
  avatar-url-prefix: http://localhost:9005/avatar
  # 简历存储桶
  resume-bucket: resume
  resume-url-prefix: http://localhost:9005/resume
  # 默认存储桶（兼容旧代码）
  bucket-name: avatar
  url-prefix: http://localhost:9005/avatar

# 开发环境日志级别
logging:
  level:
    root: INFO
    app.intelligent.resume: DEBUG
    com.baomidou.mybatisplus: DEBUG
