server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intelligent_resume?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MinIO配置
minio:
  endpoint: http://localhost:9005
  access-key: root
  secret-key: 12345678
  # 头像存储桶
  avatar-bucket: avatar
  avatar-url-prefix: http://localhost:9005/avatar
  # 简历存储桶
  resume-bucket: resume
  resume-url-prefix: http://localhost:9005/resume
  # 默认存储桶（兼容旧代码）
  bucket-name: avatar
  url-prefix: http://localhost:9005/avatar

# 阿里云通义千问API配置
alibaba:
  qwen:
    # API Key（需要在阿里云百炼平台获取）
    # 获取地址：https://bailian.console.aliyun.com/
    api-key: sk-94e6757f073941c3891434e41d886934
    # 模型名称选择：
    # - qwen-turbo: 速度快，成本低
    # - qwen-plus: 推荐！能力均衡，适合简历分析
    # - qwen-max: 最强能力，复杂分析
    # - qwen-max-longcontext: 支持长文本
    model: qwen-plus
    # 请求超时时间（秒）
    timeout: 60
    # 是否启用AI分析（设为false时使用纯规则引擎）
    enabled: true

# 开发环境日志级别
logging:
  level:
    root: INFO
    app.intelligent.resume: DEBUG
    com.baomidou.mybatisplus: DEBUG
