server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intelligent_resume?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MinIO配置
minio:
  endpoint: http://localhost:9005
  access-key: root
  secret-key: 12345678
  # 头像存储桶
  avatar-bucket: avatar
  # 通过后端代理访问，避免跨域问题
  avatar-url-prefix: http://localhost:8080/api/files/avatar
  # 简历存储桶
  resume-bucket: resume
  resume-url-prefix: http://localhost:8080/api/files/resume
  # 聊天文件存储桶
  chat-bucket: chat
  chat-url-prefix: http://localhost:8080/api/files/chat
  # 默认存储桶（兼容旧代码）
  bucket-name: avatar
  url-prefix: http://localhost:8080/api/files/avatar

# 阿里云通义千问API配置
alibaba:
  qwen:
    # API Key（需要在阿里云百炼平台获取）
    # 获取地址：https://bailian.console.aliyun.com/
    api-key: xxx
    # 模型名称选择：
    # - qwen-turbo: 速度快，成本低
    # - qwen-plus: 推荐！能力均衡，适合简历分析
    # - qwen-max: 最强能力，复杂分析
    # - qwen-max-longcontext: 支持长文本
    model: qwen-plus
    # 请求超时时间（秒）
    timeout: 60
    # 是否启用AI分析（设为false时使用纯规则引擎）
    enabled: true
  # 阿里云短信服务配置
  sms:
    # 是否启用真实短信发送（false时使用Mock模式，验证码打印到日志）
    enabled: false
    # AccessKey ID（在阿里云控制台获取）
    access-key-id: your-access-key-id
    # AccessKey Secret（在阿里云控制台获取）
    access-key-secret: your-access-key-secret
    # 短信签名（需要在阿里云短信控制台申请）
    sign-name: 智能简历
    # 验证码短信模板Code（需要在阿里云短信控制台申请）
    # 模板内容示例：您的验证码为：${code}，10分钟内有效，请勿泄露给他人。
    template-code: SMS_123456789
    # 区域ID
    region-id: cn-hangzhou

# 开发环境日志级别
logging:
  level:
    root: INFO
    app.intelligent.resume: DEBUG
    com.baomidou.mybatisplus: DEBUG
